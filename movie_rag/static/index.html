<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
  <title>Киноархив</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Киноархив — на главную">Киноархив</a>
    </header>

    <main>
      <section class="workspace" aria-label="Поиск по киноархиву">
        <div class="main-column">
          <div class="query-panel">
            <div class="field">
              <label class="sr-only" for="discover-input">Фильм, сериал или человек</label>
              <div class="search-row">
                <input id="discover-input" type="search" autocomplete="off" placeholder="Найти фильм, сериал или человека" aria-label="Поиск фильма, сериала или человека">
                <button id="discover-button" class="button button-secondary" type="button">Найти</button>
              </div>
              <div id="discover-results" class="discover-results" aria-live="polite"></div>
              <div id="selected" class="selected hidden"></div>
            </div>

            <div class="field question-field">
              <label class="sr-only" for="question">Вопрос</label>
              <textarea id="question" rows="2" placeholder="Спросите о фильме или человеке…" aria-label="Вопрос"></textarea>
            </div>

            <div class="toolbar">
              <details class="advanced">
                <summary>Метод</summary>
                <div class="advanced-content">
                  <label for="search-mode">Метод поиска</label>
                  <select id="search-mode" aria-label="Метод поиска">
                    <option value="hybrid">BM25 + поиск по смыслу</option>
                    <option value="bm25">Только BM25</option>
                    <option value="semantic">Только по смыслу</option>
                  </select>
                </div>
              </details>
              <button id="ask-button" class="button button-primary" type="button" disabled>Спросить <span aria-hidden="true">→</span></button>
            </div>
            <p id="status" class="status" role="status"></p>
          </div>

          <section id="answer-panel" class="answer-panel hidden" aria-labelledby="answer-title">
            <div class="answer-header">
              <h2 id="answer-title">Ответ</h2>
              <span id="answer-mode" class="mode-pill sr-only"></span>
            </div>
            <div id="answer-text" class="answer-text"></div>
          </section>
        </div>

        <aside id="sources-column" class="sources-column hidden" aria-label="Источники ответа">
          <div class="sources-header"><h2>Источники</h2><span id="source-count" class="source-count"></span></div>
          <div id="sources" class="sources-list"></div>
        </aside>
      </section>
    </main>

    <footer>
      <span>Данные: <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer">TMDB</a> и <a href="https://ru.wikipedia.org/" target="_blank" rel="noopener noreferrer">Wikipedia</a></span>
      <small>This product uses the TMDB API but is not endorsed or certified by TMDB.</small>
    </footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
